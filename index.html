<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodePen - Drag Papers ❤️</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Homemade+Apple&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="paper heart">
    <img src="img5.png" />
  </div>

  <div class="paper image">
    <p>Your smile makes me happy</p>
    <p>all the time</p>
    <img src="Img1.png" />
  </div>

  <div class="paper image">
    <p>How can be</p>
    <p>someone be so handsome and cute ❤️</p>
    <img src="img3.png" />
  </div>

  <div class="paper red image">
    <p class="p1">you are the Best person</p>
    <p class="p2">I met on this planet</p>
    <img src="img2.png" />
  </div>

  <div class="paper image">
    <p class="p1">You are Cute And</p>
    <p class="p1">Amazing <span style="color: red !important;">❤️</span></p>
    <img src="img4.png" />
  </div>

  <div class="paper">
    <p class="p1">Drag the papers to move!</p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
